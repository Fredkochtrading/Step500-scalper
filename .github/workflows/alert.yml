name: Step 500 alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - name: Check signal
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python alert.py
      - name: Remember last signal
        run: |
          git config user.name "alerts-bot"
          git config user.email "alerts-bot@users.noreply.github.com"
          git add last_signal.txt
          git diff --cached --quiet || git commit -m "update signal"
          git push
